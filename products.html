<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Research — DropLaunch</title>
    <meta name="description"
        content="Research dropshipping products with advanced filters. Find products by niche, price, sales volume, and profit margin.">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .results-count {
            font-size: 13px;
            color: var(--text-secondary);
            margin-left: auto;
        }

        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }

        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(124, 58, 237, 0.15);
            color: var(--accent-purple-light);
            border: 1px solid rgba(124, 58, 237, 0.3);
            cursor: pointer;
        }

        .filter-chip:hover {
            background: rgba(124, 58, 237, 0.25);
        }

        .modal-product-img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .modal-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .modal-stat {
            background: var(--bg-primary);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .modal-stat-val {
            font-size: 20px;
            font-weight: 800;
        }

        .modal-stat-lbl {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--text-secondary);
        }

        .detail-value {
            font-weight: 600;
        }

        .tags-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        .sort-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
        }

        .sort-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .sort-btn.active {
            border-color: var(--accent-purple);
            color: var(--accent-purple-light);
            background: rgba(124, 58, 237, 0.1);
        }
    </style>
</head>

<body>
    <div class="overlay-bg" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">🚀</div>
            <span class="logo-text">DropLaunch</span>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-label">Research</div>
            <a href="index.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
            <a href="products.html" class="nav-item active"><span class="nav-icon">🔍</span> Product Research</a>
            <a href="winning.html" class="nav-item"><span class="nav-icon">🔥</span> Winning Products <span
                    class="nav-badge">HOT</span></a>
            <a href="niche.html" class="nav-item"><span class="nav-icon">🎯</span> Niche Finder</a>
            <div class="nav-section-label">Intelligence</div>
            <a href="competitors.html" class="nav-item"><span class="nav-icon">🏪</span> Competitor Analysis</a>
            <a href="ads.html" class="nav-item"><span class="nav-icon">📢</span> Ad Library</a>
            <div class="nav-section-label">My Business</div>
            <a href="store-setup.html" class="nav-item"><span class="nav-icon">🔗</span> Store Setup</a>
            <a href="suppliers.html" class="nav-item"><span class="nav-icon">📦</span> Suppliers</a>
            <a href="orders.html" class="nav-item"><span class="nav-icon">🚚</span> Orders</a>
            <a href="analytics.html" class="nav-item"><span class="nav-icon">📈</span> Analytics</a>
            <a href="mystore.html" class="nav-item"><span class="nav-icon">🛒</span> My Store</a>
            <a href="calculator.html" class="nav-item"><span class="nav-icon">🧮</span> Calculator</a>
        </nav>
        <div class="sidebar-footer">
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
                <span class="nav-icon theme-icon">☀️</span>
                <span class="theme-label">Light Mode</span>
            </button>
        </div>
    </aside>

    <div class="main-content">
        <header class="topbar">
            <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
            <h1 class="topbar-title">Product Research</h1>
            <div class="topbar-search">
                <input type="text" placeholder="Search products..." id="searchInput">
            </div>
            <div class="topbar-actions">
                <button class="btn-icon">🔔</button>
                <div class="avatar">D</div>
            </div>
        </header>

        <main class="page-content">
            <!-- Filters -->
            <div class="filters-bar">
                <input type="text" class="search-input" id="productSearch" placeholder="Search products...">
                <select class="filter-select" id="filterNiche">
                    <option value="">All Niches</option>
                </select>
                <select class="filter-select" id="filterCompetition">
                    <option value="">All Competition</option>
                    <option value="Low">Low Competition</option>
                    <option value="Medium">Medium Competition</option>
                    <option value="High">High Competition</option>
                </select>
                <select class="filter-select" id="filterMargin">
                    <option value="">Any Margin</option>
                    <option value="60">60%+ Margin</option>
                    <option value="70">70%+ Margin</option>
                    <option value="75">75%+ Margin</option>
                </select>
                <div class="results-count" id="resultsCount">16 products</div>
            </div>

            <!-- Sort Buttons -->
            <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">
                <button class="sort-btn active" data-sort="revenue" onclick="setSort(this,'revenue')">💰 Top
                    Revenue</button>
                <button class="sort-btn" data-sort="sales" onclick="setSort(this,'sales')">📦 Most Sales</button>
                <button class="sort-btn" data-sort="margin" onclick="setSort(this,'margin')">📈 Best Margin</button>
                <button class="sort-btn" data-sort="price" onclick="setSort(this,'price')">💲 Lowest Price</button>
            </div>

            <!-- Products Grid -->
            <div class="products-grid" id="productsGrid"></div>
        </main>
    </div>

    <!-- Product Modal -->
    <div class="modal-overlay" id="productModal" onclick="handleModalClick(event)">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Product Details</div>
                <button class="modal-close" onclick="closeModal('productModal')">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/data.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/products.js"></script>
</body>

</html>
