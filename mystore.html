<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store — DropLaunch</title>
    <meta name="description"
        content="Manage your saved dropshipping products. Calculate profits and export your product list.">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .store-empty {
            text-align: center;
            padding: 80px 20px;
        }

        .store-empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .store-empty-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .store-empty-text {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .saved-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .saved-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: var(--transition);
        }

        .saved-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-glow);
        }

        .saved-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .saved-body {
            padding: 14px;
        }

        .saved-name {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .saved-niche {
            font-size: 11px;
            color: var(--accent-teal);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        .saved-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .sm {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 7px 4px;
            text-align: center;
        }

        .sm-val {
            font-size: 13px;
            font-weight: 700;
        }

        .sm-lbl {
            font-size: 9px;
            color: var(--text-muted);
        }

        .calc-section {
            background: var(--bg-secondary);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .calc-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 12px;
        }

        .calc-label {
            color: var(--text-secondary);
            flex: 1;
        }

        .calc-input {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 8px;
            color: var(--text-primary);
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            width: 80px;
            outline: none;
        }

        .calc-input:focus {
            border-color: var(--accent-purple);
        }

        .calc-result {
            display: flex;
            justify-content: space-between;
            padding-top: 6px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            font-weight: 700;
        }

        .store-header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .store-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
    </style>
</head>

<body>
    <div class="overlay-bg" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">🚀</div><span class="logo-text">DropLaunch</span>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-label">Research</div>
            <a href="index.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
            <a href="products.html" class="nav-item"><span class="nav-icon">🔍</span> Product Research</a>
            <a href="winning.html" class="nav-item"><span class="nav-icon">🔥</span> Winning Products <span
                    class="nav-badge">HOT</span></a>
            <a href="niche.html" class="nav-item"><span class="nav-icon">🎯</span> Niche Finder</a>
            <div class="nav-section-label">Intelligence</div>
            <a href="competitors.html" class="nav-item"><span class="nav-icon">🏪</span> Competitor Analysis</a>
            <a href="ads.html" class="nav-item"><span class="nav-icon">📢</span> Ad Library</a>
            <div class="nav-section-label">My Business</div>
            <a href="store-setup.html" class="nav-item"><span class="nav-icon">🔗</span> Store Setup</a>
            <a href="suppliers.html" class="nav-item"><span class="nav-icon">📦</span> Suppliers</a>
            <a href="orders.html" class="nav-item"><span class="nav-icon">🚚</span> Orders</a>
            <a href="analytics.html" class="nav-item"><span class="nav-icon">📈</span> Analytics</a>
            <a href="mystore.html" class="nav-item active"><span class="nav-icon">🛒</span> My Store</a>
            <a href="calculator.html" class="nav-item"><span class="nav-icon">🧮</span> Calculator</a>
        </nav>
        <div class="sidebar-footer">
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
                <span class="nav-icon theme-icon">☀️</span><span class="theme-label">Light Mode</span>
            </button>
        </div>
    </aside>

    <div class="main-content">
        <header class="topbar">
            <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
            <h1 class="topbar-title">My Store</h1>
            <div class="topbar-search"><input type="text" placeholder="Search saved products..." id="storeSearch"></div>
            <div class="topbar-actions">
                <button class="btn-icon">🔔</button>
                <div class="avatar">D</div>
            </div>
        </header>

        <main class="page-content">
            <div id="storeContent"></div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="js/data.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/mystore.js"></script>
</body>

</html>
