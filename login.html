<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — DropLaunch</title>
    <meta name="description"
        content="Sign in or create your free DropLaunch account to start finding winning products.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0f0f13;
            --bg-card: #18181f;
            --border: rgba(255, 255, 255, 0.08);
            --text: #f1f1f3;
            --text-muted: #6b7280;
            --text-secondary: #9ca3af;
            --purple: #7c3aed;
            --purple-light: #a78bfa;
            --teal: #06b6d4;
            --green: #10b981;
            --red: #ef4444;
            --radius: 14px;
            --transition: all 0.2s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated background blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
            animation: float 8s ease-in-out infinite;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: var(--purple);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 300px;
            height: 300px;
            background: var(--teal);
            bottom: -80px;
            right: -80px;
            animation-delay: 3s;
        }

        .blob-3 {
            width: 200px;
            height: 200px;
            background: var(--green);
            top: 50%;
            left: 50%;
            animation-delay: 6s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-20px) scale(1.05);
            }
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
            justify-content: center;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--purple), var(--teal));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--purple-light), var(--teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            border-radius: 9px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-muted);
            border: none;
            background: none;
        }

        .tab.active {
            background: var(--purple);
            color: #fff;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
        }

        /* Form */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: var(--transition);
        }

        .form-input:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--purple), #6d28d9);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .btn-google {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .google-icon {
            width: 18px;
            height: 18px;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            color: #fca5a5;
            margin-bottom: 16px;
            display: none;
        }

        .success-msg {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            color: #6ee7b7;
            margin-bottom: 16px;
            display: none;
        }

        .forgot-link {
            text-align: right;
            margin-bottom: 16px;
        }

        .forgot-link a {
            font-size: 12px;
            color: var(--purple-light);
            text-decoration: none;
        }

        .forgot-link a:hover {
            text-decoration: underline;
        }

        .terms {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 16px;
            line-height: 1.6;
        }

        .terms a {
            color: var(--purple-light);
            text-decoration: none;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #resetForm {
            display: none;
        }

        .back-link {
            font-size: 13px;
            color: var(--purple-light);
            cursor: pointer;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="auth-card">
        <div class="logo">
            <div class="logo-icon">🚀</div>
            <span class="logo-text">DropLaunch</span>
        </div>

        <!-- Error / Success -->
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <!-- Main Auth Form -->
        <div id="authForm">
            <div class="tabs">
                <button class="tab active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
                <button class="tab" id="tabSignup" onclick="switchTab('signup')">Create Account</button>
            </div>

            <!-- Login Fields -->
            <div id="loginFields">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com"
                        autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="••••••••"
                        autocomplete="current-password">
                </div>
                <div class="forgot-link"><a href="#" onclick="showReset()">Forgot password?</a></div>
                <button class="btn-primary" id="loginBtn" onclick="handleLogin()">Sign In</button>
            </div>

            <!-- Signup Fields -->
            <div id="signupFields" style="display:none;">
                <div class="form-group">
                    <label class="form-label">Display Name</label>
                    <input type="text" class="form-input" id="signupName" placeholder="Your name" autocomplete="name">
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" id="signupEmail" placeholder="you@example.com"
                        autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="signupPassword" placeholder="Min 6 characters"
                        autocomplete="new-password">
                </div>
                <button class="btn-primary" id="signupBtn" onclick="handleSignup()" style="margin-bottom:0;">Create Free
                    Account</button>
                <div class="terms">By signing up you agree to our <a href="#">Terms of Service</a> and <a
                        href="#">Privacy Policy</a>.</div>
            </div>

            <div class="divider">or continue with</div>
            <button class="btn-google" onclick="handleGoogle()">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                Continue with Google
            </button>
        </div>

        <!-- Password Reset Form -->
        <div id="resetForm">
            <span class="back-link" onclick="hideReset()">← Back to Sign In</span>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" id="resetEmail" placeholder="you@example.com">
            </div>
            <button class="btn-primary" onclick="handleReset()">Send Reset Email</button>
        </div>
    </div>

    <script type="module">
        import { signUpWithEmail, loginWithEmail, loginWithGoogle, resetPassword, onAuthStateChanged } from './js/auth.js';

        // If already logged in, redirect to dashboard
        onAuthStateChanged((user) => {
            if (user) window.location.href = '/index.html';
        });

        window.switchTab = function (tab) {
            const isLogin = tab === 'login';
            document.getElementById('tabLogin').classList.toggle('active', isLogin);
            document.getElementById('tabSignup').classList.toggle('active', !isLogin);
            document.getElementById('loginFields').style.display = isLogin ? 'block' : 'none';
            document.getElementById('signupFields').style.display = isLogin ? 'none' : 'block';
            clearMessages();
        };

        window.showReset = function () {
            document.getElementById('authForm').style.display = 'none';
            document.getElementById('resetForm').style.display = 'block';
            clearMessages();
        };

        window.hideReset = function () {
            document.getElementById('authForm').style.display = 'block';
            document.getElementById('resetForm').style.display = 'none';
            clearMessages();
        };

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('successMsg').style.display = 'none';
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';
        }

        function clearMessages() {
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';
        }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            btn.disabled = loading;
            btn.innerHTML = loading ? '<span class="spinner"></span>Please wait...' : btn.dataset.label;
        }

        // Store original labels
        document.getElementById('loginBtn').dataset.label = 'Sign In';
        document.getElementById('signupBtn').dataset.label = 'Create Free Account';

        window.handleLogin = async function () {
            clearMessages();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) return showError('Please fill in all fields.');
            setLoading('loginBtn', true);
            try {
                await loginWithEmail(email, password);
                window.location.href = '/index.html';
            } catch (e) {
                setLoading('loginBtn', false);
                showError(friendlyError(e.code));
            }
        };

        window.handleSignup = async function () {
            clearMessages();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            if (!name || !email || !password) return showError('Please fill in all fields.');
            if (password.length < 6) return showError('Password must be at least 6 characters.');
            setLoading('signupBtn', true);
            try {
                await signUpWithEmail(email, password, name);
                window.location.href = '/index.html';
            } catch (e) {
                setLoading('signupBtn', false);
                showError(friendlyError(e.code));
            }
        };

        window.handleGoogle = async function () {
            clearMessages();
            try {
                await loginWithGoogle();
                window.location.href = '/index.html';
            } catch (e) {
                showError(friendlyError(e.code));
            }
        };

        window.handleReset = async function () {
            clearMessages();
            const email = document.getElementById('resetEmail').value.trim();
            if (!email) return showError('Please enter your email.');
            try {
                await resetPassword(email);
                showSuccess('Reset email sent! Check your inbox.');
            } catch (e) {
                showError(friendlyError(e.code));
            }
        };

        // Enter key support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const loginVisible = document.getElementById('loginFields').style.display !== 'none';
                const resetVisible = document.getElementById('resetForm').style.display !== 'none';
                if (resetVisible) handleReset();
                else if (loginVisible) handleLogin();
                else handleSignup();
            }
        });

        function friendlyError(code) {
            const map = {
                'auth/user-not-found': 'No account found with that email.',
                'auth/wrong-password': 'Incorrect password. Try again.',
                'auth/email-already-in-use': 'An account with this email already exists.',
                'auth/weak-password': 'Password must be at least 6 characters.',
                'auth/invalid-email': 'Please enter a valid email address.',
                'auth/popup-closed-by-user': 'Google sign-in was cancelled.',
                'auth/network-request-failed': 'Network error. Check your connection.',
                'auth/too-many-requests': 'Too many attempts. Please try again later.',
                'auth/invalid-credential': 'Incorrect email or password.',
            };
            return map[code] || 'Something went wrong. Please try again.';
        }
    </script>
</body>

</html>
